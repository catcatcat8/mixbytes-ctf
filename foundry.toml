[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.17"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[fmt]
line_length = 120
ignore = ["contracts/**/*.sol"]

[lint]
# The challenge contracts are intentionally vulnerable and kept as-is.
lint_on_build = false
